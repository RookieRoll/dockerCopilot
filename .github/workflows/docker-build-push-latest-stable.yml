name: docker-build-push-latest-stable

env:
  DOCKERHUB_USERNAME: "2807645688"
  DOCKERHUB_IMAGE: "2807645688/dockercopilot"

on:
  workflow_dispatch:
  push:
    branches:
      - latest
    paths:
      - version

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/package.json

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload Frontend Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: my-artifact-front-dist
          path: frontend/dist

  build-backend:
    needs: [ build-frontend ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ amd64, arm64 ]
    steps:
      - name: Checkout code back end
        uses: actions/checkout@v7

      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: my-artifact-front-*
          merge-multiple: true
          path: front

      - run: ls -R front

      - name: Get version from file
        id: get_version
        run: |
          echo "version=$(cat version)" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
          cache-dependency-path: go.sum

      - name: Build for ${{ matrix.arch }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -a --trimpath -ldflags="-w -s -X 'github.com/onlyLTY/dockerCopilot/internal/config.Version=${{ env.version }}' -X 'github.com/onlyLTY/dockerCopilot/internal/config.BuildDate=$(date)'" -o dist/linux/${{ matrix.arch }}/dockerCopilot .

      - name: Prepare Files
        run: |
          mkdir -p dc-back-${{ matrix.arch }}
          cp -r dist dc-back-${{ matrix.arch }}/dist
          cp -r etc dc-back-${{ matrix.arch }}/etc

      - name: Upload Backend Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: my-artifact-backend-${{ matrix.arch }}
          path: dc-back-${{ matrix.arch }}

  docker-setup:
    runs-on: ubuntu-latest
    needs: [ build-frontend, build-backend ]
    steps:
      - name: Checkout code Now Code
        uses: actions/checkout@v7

      - name: Download Backend Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: my-artifact-backend-*
          merge-multiple: true
          path: dc-back

      - run: ls -R dc-back

      - name: Get version from file
        run: |
          echo "version=$(cat version)" >> $GITHUB_ENV

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ env.version }}
          push: true